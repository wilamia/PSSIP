<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Person</title>
    <script>
        class Person {
            constructor(name, age, gender, socialStatus) {
                this.name = name;
                this.age = age;
                this.gender = gender;
                this.socialStatus = socialStatus;

                // 1. Запрет изменения значения свойства name
                Object.defineProperty(this, 'name', {
                    writable: false,
                    configurable: true,
                    enumerable: true
                });

                // 2. Запрет удаления свойства age
                Object.defineProperty(this, 'age', {
                    configurable: false,
                    writable: true,
                    enumerable: true
                });

                // 3. Запрет вывода в циклах для socialStatus
                Object.defineProperty(this, 'socialStatus', {
                    enumerable: false,
                    writable: true,
                    configurable: true
                });
            }

            askInfo() {
                let activityQuestion = '';
                if (this.gender === 'м') {
                    activityQuestion = `${this.name}, вы занимаетесь спортом?`;
                } else if (this.gender === 'ж') {
                    activityQuestion = `${this.name}, вы занимаетесь фитнесом?`;
                } else {
                    return 'Пол не определен.';
                }
                const activityResponse = prompt(activityQuestion);
                return `Имя: ${this.name}, Возраст: ${this.age}, Пол: ${this.gender}, Социальный статус: ${this.socialStatus}, Ответ: ${activityResponse}`;
            }
        }

        function createPerson() {
            const name = prompt("Введите имя:");
            const age = prompt("Введите возраст:");
            const gender = prompt("Введите пол (м/ж):");
            const socialStatus = prompt("Введите социальный статус:");

            return new Person(name, age, gender, socialStatus);
        }

        const person1 = createPerson();
        const response1 = person1.askInfo();
        console.log(response1);

        // Попытка изменить name — не сработает
        person1.name = "Новое имя";
        console.log("После попытки изменить имя:", person1.name);

        // Попытка удалить age — не сработает
        delete person1.age;
        console.log("После попытки удалить возраст:", person1.age);

        // Вывод свойств 1-м способом — for...in (пропустит socialStatus)
        console.log("Вывод свойств через for...in:");
        for (let key in person1) {
            console.log(`${key}: ${person1[key]}`);
        }

        // Вывод свойств 2-м способом — Object.getOwnPropertyNames (выведет все, включая socialStatus)
        console.log("Вывод свойств через Object.getOwnPropertyNames:");
        Object.getOwnPropertyNames(person1).forEach(key => {
            console.log(`${key}: ${person1[key]}`);
        });
    </script>
</head>
<body>
</body>
</html>
